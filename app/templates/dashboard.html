<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;
        }

        .navbar {
            height: 60px;

            background: #1f2937;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;
        }

        .logo {
            font-size: 20px;

            font-weight: bold;
        }

        .logout {
            color: white;

            text-decoration: none;

            background: #dc2626;

            padding: 8px 15px;

            border-radius: 6px;
        }

        .container {
            min-height: calc(100vh - 60px);

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .card {
            background: white;

            padding: 50px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .message {
            color: #666;

            font-size: 17px;
        }

        .status {
            margin-top: 25px;

            display: inline-block;

            background: #dcfce7;

            color: #166534;

            padding: 8px 15px;

            border-radius: 20px;

            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        DevOps Application
    </div>

    <a class="logout" href="/logout">
        Logout
    </a>

</div>

<div class="container">

    <div class="card">

        <h1>
            Welcome, {{ username }}!
        </h1>

        <div class="message">

            You have successfully logged in.

        </div>

        <div class="status">

            Application is running successfully

        </div>

    </div>

</div>

</body>

</html>
